[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
thermal-raster = { path = "crates/thermal-raster" }
thermal-markdown = { path = "crates/thermal-markdown" }
thermal-proto = { path = "crates/thermal-proto" }
thermal-ble = { path = "crates/thermal-ble" }
thermal-ffi = { path = "crates/thermal-ffi" }

image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
pulldown-cmark = { version = "0.13", default-features = false }
cosmic-text = "0.19"
fontdb = { version = "0.23", default-features = false, features = ["std", "fs", "memmap"] }
eframe = "0.37"
egui = "0.37"
rfd = "0.17"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
thiserror = "2"
btleplug = "0.13"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
futures = "0.3"
uuid = "1"
uniffi = "0.32"
unicode-script = "0.5"

# Image processing and text shaping are slow unoptimised; keep debug builds usable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
